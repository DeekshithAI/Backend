name: Python CI/CD Pipeline

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 ruff black

      - name: Lint with ruff
        run: |
          ruff check . --select=E,W,F --show-source --statistics
        continue-on-error: true

      - name: Format check with black
        run: |
          black --check . || true
        continue-on-error: true

      - name: Syntax check with py_compile
        run: |
          python -m py_compile api/drone_router.py main.py

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short --cov=. --cov-report=xml
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
        continue-on-error: true

  build-docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: vaayu-backend:latest
          cache-from: type=registry,ref=vaayu-backend:buildcache
          cache-to: type=registry,ref=vaayu-backend:buildcache,mode=max

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v3

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your deployment script or command here
          # Example: docker-compose -f docker-compose.staging.yml up -d
        continue-on-error: true
